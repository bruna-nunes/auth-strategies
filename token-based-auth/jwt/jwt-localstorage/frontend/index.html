<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>JWT Auth - Localstorage</title>
</head>
<body>
  <h2>Login</h2>
  <input type="text" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />
  <button onclick="login()">Enter</button>

  <h2>Protected resource</h2>
  <button onclick="accessProtectedResource()">Access</button>
  <p id="response"></p>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('token-jwt-localstorage', data.token);
        alert('login successfully!');
      } else {
        alert(data.message);
      }
    }

    async function accessProtectedResource() {
      const token = localStorage.getItem('token-jwt-localstorage');

      const res = await fetch('http://localhost:3000/resource-protected-by-jwt-auth-localstorage', {
        headers: { 'Authorization': 'Bearer ' + token }
      });

      const data = await res.json();
      document.getElementById('response').textContent = data.message;
    }
  </script>
</body>
</html>
